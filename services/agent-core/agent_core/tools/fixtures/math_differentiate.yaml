# Tool fixtures (TOL-05): synthetic, hand-written.
tool: math_differentiate
version: 2
valid_args:
- expression: x^3 - 3x
  stationary_points: true
- expression: y = x^2
  at: 2
- expression: x^4
  student: 4x^3
invalid_args:
- expression: x^2
  order: 4
- expression: ''
- at: 2
description_lint:
  sections:
  - what
  - use_when
  - parameters
  - returns
  - limits
  - recovery
  max_chars_full: 600
repairs:
- mistake: arguments sent as a JSON string
  input: '{"text": "x+1"}'
  repaired:
    note: same pattern on this tool's arguments
- mistake: argument names in camelCase
  input:
    Text: x+1
  repaired:
    note: same pattern on this tool's arguments
envelopes:
  unknown_tool:
    first_clause: No action was taken.
    retryable: false
  unavailable:
    first_clause: No action was taken.
    retryable: false
  invalid_args:
    first_clause: No action was taken.
    retryable: true
  truncated_args:
    first_clause: No action was taken.
    retryable: true
  policy_denied:
    first_clause: No action was taken.
    retryable: false
  student_declined:
    first_clause: The action completed, but
    retryable: false
  timeout:
    first_clause: No action was taken.
    retryable: true
  cancelled:
    first_clause: No action was taken.
    retryable: false
  worker_crashed:
    first_clause: No action was taken.
    retryable: true
  worker_unavailable:
    first_clause: No action was taken.
    retryable: false
  limit_exceeded:
    first_clause: No action was taken.
    retryable: false
  domain_error:
    first_clause: No action was taken.
    retryable: false
  execution_error:
    first_clause: No action was taken.
    retryable: false
  result_too_large:
    first_clause: The action completed, but
    retryable: false
  repeated_failure_blocked:
    first_clause: No action was taken.
    retryable: false
golden: services/tool-worker/tool_worker/golden/math_differentiate.yaml
