<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jana</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--card:#fff;--ink:#17171a;--muted:#5c5c66;--line:#d6d6d0;--go:#17171a;--on:#fff;--bad:#a4262c}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#f1f1f3;--muted:#a6a6b0;--line:#3d3d45;--go:#f1f1f3;--on:#141416;--bad:#ff8a8f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px}
main{background:var(--card);border:1px solid var(--line);border-radius:16px;width:100%;max-width:420px;padding:28px}
h1{margin:0 0 4px;font-size:24px}p{margin:0 0 16px;color:var(--muted)}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit}
button,a.google{display:block;width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:var(--go);color:var(--on);font:600 16px system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
a.google,button.quiet{background:transparent;color:var(--ink);border:1px solid var(--line)}
.bad{color:var(--bad);margin:12px 0 0}.foot{margin:16px 0 0;font-size:14px}.foot a{color:var(--ink)}
</style></head><body><main>
{body}
</main></body></html>
