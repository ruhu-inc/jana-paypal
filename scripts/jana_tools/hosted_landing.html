<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jana</title>
<style>
:root{color-scheme:light dark;--bg:#f7f7f5;--card:#fff;--ink:#17171a;--muted:#5c5c66;--line:#e2e2de;--go:#17171a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--card:#1d1d20;--ink:#f1f1f3;--muted:#a6a6b0;--line:#33333a;--go:#f1f1f3;--on:#141416}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
main{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:560px;padding:28px}
h1{margin:0 0 12px;font-size:26px}li{margin:8px 0}p,li{color:var(--muted)}
a.go{display:inline-block;margin-top:12px;background:var(--go);color:var(--on);padding:11px 20px;border-radius:10px;text-decoration:none;font-weight:600}
</style></head><body><main>
<h1>Welcome to Jana Study</h1>
<p>Open your worksheet in Study to read it or ask a question.</p>
<p>Your files are stored on the demo server. When Jana says “this computer”, it means this server. {study_sharing}</p>
<a class="go" href="/">Open Jana</a>
</main></body></html>
